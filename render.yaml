# Render Blueprint for Bundle. Nothing is created until you connect the repo on render.com and choose this file.
services:
  - type: web
    name: bundle
    runtime: node
    plan: starter            # always-on: the free tier sleeps and takes about a minute to wake
    buildCommand: npm ci --include=dev && npm run build   # --include=dev: with NODE_ENV=production plain npm ci skips the build tools (vite, esbuild)
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: SAMPLE_MODE
        value: "true"
      - key: TRUST_PROXY
        value: "1"
      - key: NODE_VERSION
        value: "24"
      # Optional. Enter real values in Render's dashboard, never in this file.
      - key: MODEL_API_KEY
        sync: false
      - key: MODEL_REASONING
        sync: false
      - key: MODEL_FAST
        sync: false
